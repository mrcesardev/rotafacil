# RotaFácil com Vercel + Supabase + VPS (veja DEPLOY-VERCEL-SUPABASE.md).
#
# Nesta VPS: Caddy (HTTPS da API) + API + OSRM + VROOM + backup do Supabase.
# As páginas ficam na Vercel e o banco no Supabase.
#
#   docker compose -f docker-compose.vps.yml up -d --build
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/Caddyfile.api:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # navegador -> Vercel -> Caddy -> app: o IP real do cliente está 2 saltos atrás
      TRUST_PROXY: "2"
      DATABASE_SSL_CA: /certs/supabase-ca.crt
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
    volumes:
      - ./certs/supabase-ca.crt:/certs/supabase-ca.crt:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      osrm:
        condition: service_started
      vroom:
        condition: service_started

  # cópia diária do banco do Supabase em ./backups (além dos backups do próprio Supabase)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/supabase-ca.crt
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
      - ./certs/supabase-ca.crt:/certs/supabase-ca.crt:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 --max-viaroute-size 1000 /data/region.osrm
    volumes:
      - ./osrm-data:/data

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
