<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sua entrega</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="recipient">
    <header>
      <p class="muted" id="store"></p>
      <h1 id="title">Carregando…</h1>
      <p id="subtitle"></p>
    </header>

    <!-- acompanhamento -->
    <div id="statusCard" class="card hidden"></div>

    <!-- formulário: onde você quer receber? -->
    <form id="form" class="hidden" novalidate>
      <div class="row">
        <button type="button" id="gps" class="primary">📍 Usar minha localização atual</button>
      </div>
      <div class="row" style="margin-top:.5rem">
        <input id="search" placeholder="Ou busque: rua, número, bairro, cidade" aria-label="Buscar endereço">
        <button type="button" class="shrink" id="searchBtn">Buscar</button>
      </div>
      <ul class="list" id="results"></ul>
      <p class="muted" id="pinHint" style="margin:.6rem 0 .3rem">Toque no mapa para marcar. Depois arraste o pino até a <b>entrada</b> onde vai receber.</p>
    </form>

    <div id="map"></div>

    <form id="details" class="hidden" novalidate>
      <label for="name">Seu nome</label>
      <input id="name" autocomplete="name" required>
      <label for="phone">WhatsApp</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999">
      <label for="reference">Referência para o entregador</label>
      <textarea id="reference" maxlength="300" style="min-height:64px" placeholder="Ex.: apto 32, portão azul, deixar na portaria"></textarea>
      <label style="display:flex;gap:.5rem;align-items:flex-start;color:var(--text)">
        <input type="checkbox" id="consent" style="width:auto;margin-top:.25rem">
        <span id="consentText"></span>
      </label>
      <p id="formError" class="warn hidden"></p>
      <button class="primary" id="confirmBtn" style="width:100%;margin-top:.8rem;padding:.8rem">Confirmar local de entrega</button>
    </form>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/common.js"></script>
  <script src="/recipient.js"></script>
</body>
</html>
