# RotaFácil em produção: Caddy (HTTPS) + app + PostgreSQL + backup + OSRM + VROOM.
#
# Primeira vez (veja DEPLOY.md):
#   ./scripts/setup-server.sh          # instala Docker, cria o .env, prepara o mapa e sobe tudo
# Atualizar depois:
#   git pull && docker compose up -d --build
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://rotafacil:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/rotafacil
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
    # só acessível pelo próprio servidor; o público entra pelo Caddy (HTTPS)
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
      vroom:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotafacil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: rotafacil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotafacil -d rotafacil"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backup diário do banco em ./backups (guarda 14 dias)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 --max-viaroute-size 1000 /data/region.osrm
    volumes:
      - ./osrm-data:/data

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    # O app envia a matriz de distâncias pronta (calculada pelo OSRM), então o VROOM
    # não precisa de configuração de roteamento.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
