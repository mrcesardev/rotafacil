# Sobe o RotaFácil completo: app + PostgreSQL + OSRM (ruas reais do OpenStreetMap) + VROOM (otimizador).
# Antes do primeiro "docker compose up", prepare o mapa da região:
#   ./scripts/prepare-osrm.sh sudeste
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rotafacil:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/rotafacil
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
      vroom:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotafacil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: rotafacil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotafacil -d rotafacil"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 --max-viaroute-size 1000 /data/region.osrm
    volumes:
      - ./osrm-data:/data

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    # O app envia a matriz de distâncias pronta (calculada pelo OSRM), então o VROOM
    # não precisa de configuração de roteamento.

volumes:
  pgdata:
